<!doctype html><meta charset=utf-8><title>Lazy scheme</title>
<button id="load">Zoom to scheme</button><div id="map"></div>
<script>
  // Nothing is fetched on load. The plots arrive only once the user acts --
  // exactly like a map that requests the features in the current view.
  window.L = { version: "fake" };
  document.getElementById("load").addEventListener("click", () => {
    fetch("/data/plots.geojson").then(r => r.json()).then(gj => {
      window.tpMapInstance = {
        _container: document.getElementById("map"),
        _layers: { 1: {} },
        eachLayer: function (cb) { cb({ toGeoJSON: function () { return gj; } }); }
      };
      document.title = "loaded";
    });
  });
</script>
